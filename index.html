<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>Pages</title>
<script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.23.0/dist/index.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f5f7fa;font-family:"Times New Roman","Microsoft YaHei","微软雅黑",sans-serif;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:2rem 1rem}
button,input,textarea,select{font-family:inherit}
.container{max-width:1100px;width:100%;background:white;border-radius:32px;box-shadow:0 20px 40px -12px rgba(0,0,0,.15);padding:2rem 1.8rem;transition:.2s}
h1{font-size:2.2rem;font-weight:600;color:#1e293b;letter-spacing:-.5px;border-bottom:2px solid #e9edf4;padding-bottom:.6rem;margin-bottom:1.8rem}
.cloud-status{display:flex;align-items:center;gap:8px;font-size:.85rem;color:#475569;padding:.3rem 1rem;background:#f1f5f9;border-radius:40px;float:right;margin-top:-2.8rem}
.cloud-status .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.cloud-status .dot.online{background:#22c55e}.cloud-status .dot.offline{background:#ef4444}.cloud-status .dot.syncing{background:#f59e0b;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.toolbar{display:flex;gap:10px;margin-bottom:1.8rem;flex-wrap:wrap;align-items:center;justify-content:space-between;border-bottom:1px solid #e9edf4;padding-bottom:1rem}
.toolbar .left-group,.toolbar .right-group{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar .btn-outline{background:transparent;border:1px solid #d1d9e6;padding:.4rem 1.2rem;border-radius:40px;font-weight:500;color:#334155;cursor:pointer;transition:.15s;font-size:.85rem}
.toolbar .btn-outline:hover{background:#f1f5f9;border-color:#94a3b8}
.toolbar .btn-primary-outline,.toolbar .btn-sync{background:#1E40AF;border:1px solid #1E40AF;padding:.4rem 1.2rem;border-radius:40px;font-weight:500;color:white;cursor:pointer;transition:.15s;font-size:.85rem}
.toolbar .btn-primary-outline:hover,.toolbar .btn-sync:hover{background:#1E3A8A;border-color:#1E3A8A}.toolbar .btn-sync:disabled{opacity:.6;cursor:not-allowed}
.add-section{background:#f8fafc;border-radius:24px;padding:1.6rem 1.5rem;margin-bottom:2.2rem;border:1px solid #e2e8f0}
.add-section h2{font-size:1.2rem;font-weight:500;color:#0f172a;margin-bottom:1rem}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem 1.2rem}.form-group{display:flex;flex-direction:column;gap:4px}.form-group.full-width{grid-column:1/-1}
.form-group label{font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:#475569}
.form-group input,.form-group textarea{background:white;border:1px solid #d1d9e6;border-radius:16px;padding:.7rem 1rem;font-size:.95rem;transition:.2s;font-family:inherit;resize:vertical}
.form-group input:focus,.form-group textarea:focus{outline:2px solid #1E40AF;border-color:transparent;box-shadow:0 0 0 3px rgba(124,155,255,.2)}
.form-group textarea{min-height:60px}.form-group .hint{font-size:.75rem;color:#94a3b8;margin-top:4px}
.remark-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.remark-tag{display:inline-flex;align-items:center;gap:6px;max-width:100%;border:1px solid #c7d2fe;border-radius:999px;background:#eef2ff;color:#1e3a8a;padding:3px 10px;font-size:.9rem;font-weight:400}
.remark-tag span{overflow-wrap:anywhere;min-width:0}
.remark-remove{flex:0 0 auto;border:0;background:transparent;color:inherit;cursor:pointer;font:inherit;font-size:1.15rem;width:24px;min-height:24px;border-radius:50%}
.remark-remove:hover{background:#c7d2fe}.remark-remove:focus-visible{outline:2px solid #1e40af}
.remark-combo{position:relative;width:100%;min-width:0}.remark-combo>input{width:100%}
.remark-dropdown{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:1300;max-height:260px;overflow-y:auto;padding:6px;border:1px solid #cbd5e1;border-radius:14px;background:#fff;box-shadow:0 14px 30px rgba(15,23,42,.16);overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.remark-dropdown.hidden{display:none!important}
.remark-option{display:block;width:100%;min-width:0;padding:.58rem .72rem;border:0;border-radius:9px;background:#fff;color:#0f172a;font:inherit;font-size:.9rem;line-height:1.35;text-align:left;overflow-wrap:anywhere;cursor:pointer}
.remark-option+.remark-option{margin-top:2px}.remark-option:hover,.remark-option.is-active{background:#eef2ff;color:#1e3a8a}
.remark-option-row{display:flex;align-items:stretch;gap:6px;width:100%;min-width:0}.remark-option-row+.remark-option-row{margin-top:2px}.remark-option-row .remark-option{flex:1 1 auto;width:auto;min-width:0}
.remark-option-actions{display:flex;flex:0 0 auto;align-items:center;gap:4px}
.remark-manage-btn{min-width:32px;padding:.45rem .5rem;border:1px solid #d1d9e6;border-radius:8px;background:#fff;color:#475569;font:inherit;font-size:.78rem;line-height:1;cursor:pointer}
.remark-manage-btn:hover,.remark-manage-btn:focus-visible{background:#f1f5f9;border-color:#94a3b8;outline:none}
.remark-manage-btn.delete:hover,.remark-manage-btn.delete:focus-visible{background:#fee2e2;border-color:#fecaca;color:#991b1b}
.remark-empty{padding:.65rem .72rem;color:#94a3b8;font-size:.82rem;text-align:center}
.btn-primary{grid-column:1/-1;background:#1E40AF;color:white;border:none;border-radius:40px;padding:.85rem 1.5rem;font-weight:600;font-size:1rem;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:.4rem}
.btn-primary:hover{background:#1E3A8A;transform:scale(.98)}.btn-primary:active{transform:scale(.96)}.btn-primary:disabled{opacity:.6;cursor:not-allowed;transform:none}
.table-wrapper{overflow-x:auto;border-radius:20px;border:1px solid #e9edf4;margin-top:.5rem}
.page-table{width:100%;border-collapse:collapse;font-size:.95rem}
.page-table th{background:#f1f5f9;text-align:left;padding:.9rem 1.2rem;font-weight:600;color:#1e293b;border-bottom:2px solid #d1d9e6;white-space:nowrap}
.page-table th.sortable{cursor:pointer;user-select:none;transition:background .15s}.page-table th.sortable:hover{background:#e2e8f0}.page-table th.sortable .sort-icon{margin-left:6px;font-size:.75rem;color:#94a3b8}
.page-table td{padding:.8rem 1.2rem;border-bottom:1px solid #eef2f6;vertical-align:middle;line-height:1.5}
.page-table tbody tr:hover{background:#fafcff}.page-table tbody tr:last-child td{border-bottom:none}
.page-table .col-title{min-width:200px;vertical-align:top;position:relative;--edit-reserve:4rem;padding-right:calc(1.2rem + var(--edit-reserve));-webkit-user-select:text;user-select:text;font-size:1.1rem;font-weight:700}
.page-table .col-title>a,.page-table .title-note,.page-table .title-remark{-webkit-user-select:text;user-select:text}
.page-table .title-note,.page-table .title-remark{cursor:text}
.page-table .col-title>a{-webkit-user-drag:none;cursor:default}
.page-table .col-title a{color:#1E40AF;text-decoration:none;font-size:inherit;font-weight:inherit}
.page-table .col-title a:hover{color:#1E3A8A;text-decoration:underline}

/* 提要与所有标签统一放在同一详情行组中。
   有无提要都只使用这一套行距，不给第一个标签额外增加 margin。 */
.page-table .title-details{
margin-top:.28rem;
color:#000;
font-size:1rem;
font-weight:400;
line-height:1.45;
white-space:normal;
overflow-wrap:anywhere
}
.page-table .title-note,
.page-table .title-remark,
.page-table .title-remark .remark-line{
margin:0;
padding:0;
font-size:inherit;
font-weight:inherit;
line-height:inherit;
white-space:normal;
overflow-wrap:anywhere
}
.page-table .title-note{
width:calc(100% + var(--edit-reserve));
max-width:calc(100% + var(--edit-reserve));
text-align:justify;
text-justify:inter-character;
text-align-last:left
}
.page-table .title-remark .remark-line{display:block}

.page-table .row-edit-link{position:absolute;right:1.2rem;bottom:.8rem;border:none;background:transparent;color:#64748b;padding:0;font:inherit;font-size:1rem;font-weight:400;line-height:1.45;cursor:default;text-decoration:none}
.page-table .row-edit-link:hover,.page-table .row-edit-link:focus-visible{color:#64748b;text-decoration:none;outline:none}
.empty-row td{padding:2.5rem 1rem;text-align:center;color:#94a3b8;font-size:1rem;background:#fafcff}
.list-header{display:flex;justify-content:space-between;align-items:baseline;margin:1.8rem 0 .8rem;flex-wrap:wrap;gap:10px}
.list-header h2{font-size:1.4rem;font-weight:600;color:#0f172a}
.list-header .badge{background:#e9edf4;padding:.2rem 1rem;border-radius:40px;font-size:.8rem;font-weight:500;color:#334155}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:999;animation:fadeIn .2s ease}
.modal-overlay.hidden{display:none}
.modal-box{background:white;border-radius:28px;padding:2rem 2rem 1.8rem;max-width:520px;width:92%;box-shadow:0 30px 60px rgba(0,0,0,.25);animation:slideUp .25s ease}
.modal-box h3{font-size:1.3rem;font-weight:600;color:#0f172a;margin-bottom:.2rem}
.modal-box .modal-sub{color:#64748b;font-size:.9rem;margin-bottom:1.2rem;border-bottom:1px solid #e9edf4;padding-bottom:.8rem}
.modal-box .form-group{margin-bottom:.95rem}
.modal-box .form-group label{font-size:.75rem;font-weight:600;text-transform:uppercase;color:#475569}
.modal-box .form-group input,.modal-box .form-group textarea{width:100%;background:white;border:1px solid #d1d9e6;border-radius:14px;padding:.6rem 1rem;font-size:.95rem;font-family:inherit;transition:.2s}
.modal-box .form-group input:focus,.modal-box .form-group textarea:focus{outline:2px solid #1E40AF;border-color:transparent}
.modal-box .form-group textarea{min-height:56px;resize:vertical}
.modal-actions{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:1.2rem}
.modal-actions-right{display:flex;gap:10px;align-items:center}
.modal-actions .btn-modal{padding:.5rem 1.6rem;border-radius:40px;font-weight:600;font-size:.9rem;border:none;cursor:pointer;transition:.15s}
.modal-actions .btn-modal.cancel{background:#f1f5f9;color:#334155}.modal-actions .btn-modal.cancel:hover{background:#e2e8f0}
.modal-actions .btn-modal.save{background:#1E40AF;color:white}.modal-actions .btn-modal.save:hover{background:#1E3A8A}
.modal-actions .btn-modal.delete{background:#fee2e2;color:#991b1b}.modal-actions .btn-modal.delete:hover{background:#fecaca}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);padding:.8rem 2rem;border-radius:40px;color:white;font-weight:500;font-size:.9rem;z-index:1000;animation:slideUp .3s ease;box-shadow:0 8px 30px rgba(0,0,0,.2);background:#1E40AF;max-width:90%;text-align:center}
.toast.success{background:#16a34a}.toast.error{background:#dc2626}.toast.info{background:#1E40AF}.toast.hidden{display:none}
.config-overlay{position:fixed;inset:0;width:100%;height:100vh;height:100dvh;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:1000;animation:fadeIn .25s ease;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));overflow:hidden}
.config-overlay.hidden{display:none}
.config-box{background:white;border-radius:28px;padding:2rem 2rem 1.2rem;max-width:560px;width:min(94%,560px);max-height:calc(100vh - 24px);max-height:calc(100dvh - max(24px,env(safe-area-inset-top) + env(safe-area-inset-bottom) + 16px));overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-gutter:stable;box-shadow:0 30px 60px rgba(0,0,0,.3);animation:slideUp .25s ease}
.config-box::-webkit-scrollbar{width:8px}.config-box::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:999px}.config-box::-webkit-scrollbar-track{background:transparent}
.config-box h3{font-size:1.3rem;font-weight:600;color:#0f172a;margin-bottom:.5rem}
.config-box .config-desc{color:#64748b;font-size:.9rem;margin-bottom:1.2rem;border-bottom:1px solid #e9edf4;padding-bottom:.8rem}
.config-box .form-group{margin-bottom:1rem}
.config-box .form-group label{font-size:.75rem;font-weight:600;text-transform:uppercase;color:#475569}
.config-box .form-group input{width:100%;background:white;border:1px solid #d1d9e6;border-radius:14px;padding:.7rem 1rem;font-size:.95rem;font-family:inherit;transition:.2s}
.config-box .form-group input:focus{outline:2px solid #1E40AF;border-color:transparent}
.config-box .form-group .hint{font-size:.75rem;color:#94a3b8;margin-top:4px}
.config-box .form-group .hint a{color:#1E40AF;text-decoration:none;cursor:default}
.config-box .form-group .hint a:hover{text-decoration:underline}
.config-box .token-save-option{display:flex;flex-direction:row;align-items:center;gap:8px;margin-top:8px;color:#475569;font-size:.82rem;font-weight:500;text-transform:none;letter-spacing:0;cursor:pointer}
.config-box .token-save-option input[type=checkbox]{width:16px;height:16px;margin:0;padding:0;accent-color:#1E40AF;cursor:pointer;flex:0 0 auto}
.config-box .token-save-hint{margin-left:24px;color:#64748b;line-height:1.5}
.config-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:1.2rem;position:sticky;bottom:0;z-index:3;background:linear-gradient(to bottom,rgba(255,255,255,.88),#fff 24%);padding:.9rem 0 max(.2rem,env(safe-area-inset-bottom))}
.config-actions .btn-config{padding:.5rem 1.8rem;border-radius:40px;font-weight:600;font-size:.9rem;border:none;cursor:pointer;transition:.15s}
.config-actions .btn-config.primary{background:#1E40AF;color:white}.config-actions .btn-config.primary:hover{background:#1E3A8A}
.config-actions .btn-config.secondary{background:#f1f5f9;color:#334155}.config-actions .btn-config.secondary:hover{background:#e2e8f0}
.back-to-top{position:fixed;left:auto;right:16px;top:70%;transform:translateY(-50%);z-index:900;display:block;width:30px;height:26px;padding:0;border:0;border-radius:0;background:#1E40AF;clip-path:polygon(50% 0,100% 100%,0 100%);cursor:pointer;opacity:1;filter:drop-shadow(0 4px 7px rgba(30,64,175,.24));transition:opacity .2s,background .2s,transform .2s}
.back-to-top:hover,.back-to-top:focus-visible{opacity:1;background:#1E3A8A;transform:translateY(calc(-50% - 2px));outline:none}
@media(max-width:700px){
body{width:100%;max-width:100%;padding:.75rem .5rem;overflow-x:hidden}
.container{width:100%;max-width:100%;min-width:0;padding:1.2rem}
.table-wrapper{width:100%;max-width:100%;min-width:0;overflow-x:hidden}
.page-table{width:100%;max-width:100%;min-width:0;table-layout:fixed}
.page-table th,.page-table td,.page-table .col-title{width:100%;max-width:100%;min-width:0}
.page-table .col-title{overflow-wrap:anywhere;word-break:break-word}
.page-table .col-title>a{display:inline;max-width:100%;overflow-wrap:anywhere;word-break:break-all}
.page-table .title-details,.page-table .title-note,.page-table .title-remark{max-width:100%;overflow-wrap:anywhere;word-break:break-word}
.page-table .col-title{--edit-reserve:0rem;padding-right:.8rem}
.page-table .title-note{width:100%;max-width:100%}
.page-table .row-edit-link{right:.8rem;bottom:.6rem}
.form-grid{grid-template-columns:1fr}
.page-table th,.page-table td{padding:.6rem .8rem;font-size:.85rem}
.toolbar{flex-direction:column;align-items:stretch}
.toolbar .left-group,.toolbar .right-group{justify-content:center}
.cloud-status{float:none;margin-top:0}
.config-overlay{align-items:stretch;padding:max(8px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom))}
.config-box{width:100%;max-height:calc(100dvh - max(16px,env(safe-area-inset-top) + env(safe-area-inset-bottom) + 8px));margin:auto 0;padding:1.25rem 1rem .8rem;border-radius:22px}
.config-actions{gap:8px}
.config-actions .btn-config{flex:1 1 0;min-width:0;padding-left:.75rem;padding-right:.75rem}
.back-to-top{right:3px;top:70%;width:24px;height:21px;padding:0}
}
.config-box{padding:0;display:grid;grid-template-rows:minmax(0,1fr) auto;overflow:hidden}
.config-scroll{min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:auto;scrollbar-color:#94a3b8 #eef2f7;scrollbar-gutter:stable;padding:2rem 2rem 1rem;touch-action:pan-y}
.config-scroll::-webkit-scrollbar{width:10px}.config-scroll::-webkit-scrollbar-track{background:#eef2f7}.config-scroll::-webkit-scrollbar-thumb{background:#94a3b8;border:2px solid #eef2f7;border-radius:999px}
.config-actions{position:static;bottom:auto;flex:0 0 auto;margin-top:0;padding:.9rem 2rem max(1.2rem,env(safe-area-inset-bottom));border-top:1px solid #e9edf4;background:#fff;box-shadow:0 -8px 20px rgba(15,23,42,.06)}
@media(max-width:700px){
.config-overlay{top:var(--config-vv-top,0px);bottom:auto;height:var(--config-vv-height,100dvh);min-height:0;padding:max(8px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom));align-items:stretch;overflow:hidden}
.config-box{width:100%;max-width:none;height:100%;max-height:none;min-height:0;margin:0;border-radius:22px}
.config-scroll{min-height:0;padding:1.25rem 1rem 1rem}
.config-actions{width:100%;padding:.85rem 1rem max(.85rem,env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<div class="container">
<h1>Pages <span class="cloud-status" id="cloudStatus"><span class="dot" id="statusDot"></span><span id="statusText">未配置</span></span></h1>

<div class="toolbar">
<div class="left-group">
<button class="btn-sync" id="syncBtn">同步</button>
<button class="btn-outline" id="configBtn">配置</button>
<button class="btn-outline" id="exportBtn">导出</button>
<button class="btn-outline" id="importBtn">导入</button>
<input type="file" id="fileInput" accept=".html,.htm,.json,text/html,application/json" style="display:none">
</div>
<div class="right-group"><span style="font-size:0.8rem;color:#94a3b8" id="lastSyncTime">未同步</span></div>
</div>

<div class="add-section">
<h2>添加</h2>
<div class="form-grid">
<div class="form-group full-width"><label for="pageInput">标题</label><input type="text" id="pageInput" autofocus></div>
<div class="form-group full-width"><label for="noteInput">提要</label><input type="text" id="noteInput"></div>
<div class="form-group full-width">
<label for="remarkInput">备注</label>
<div class="remark-combo" id="remarkCombo">
<input type="text" id="remarkInput" autocomplete="off" aria-autocomplete="list" aria-expanded="false" aria-controls="remarkOptions">
<div class="remark-dropdown hidden" id="remarkDropdown"><div id="remarkOptions"></div></div>
</div>
</div>
<button class="btn-primary" id="addBtn">添加</button>
</div>
</div>

<div class="list-header"><h2>总表</h2><span class="badge" id="countDisplay">0/0</span></div>
<div class="table-wrapper">
<table class="page-table" id="pageTable">
<thead><tr><th>标题</th></tr></thead>
<tbody id="tableBody"><tr class="empty-row"><td>加载中...</td></tr></tbody>
</table>
</div>
</div>

<div class="modal-overlay hidden" id="editModal">
<div class="modal-box">
<h3>编辑条目</h3>
<div class="modal-sub" id="editModalTitle">标题：<span id="editTitleDisplay"></span></div>
<div class="form-group"><label for="editPageInput">标题</label><input type="text" id="editPageInput"><div class="hint">格式：[标题](链接)</div></div>
<div class="form-group"><label for="editNoteInput">提要</label><input type="text" id="editNoteInput"></div>
<div class="form-group">
<label for="editRemarkInput">备注</label>
<div class="remark-combo" id="editRemarkCombo">
<input type="text" id="editRemarkInput" autocomplete="off" aria-autocomplete="list" aria-expanded="false" aria-controls="editRemarkOptions">
<div class="remark-dropdown hidden" id="editRemarkDropdown"><div id="editRemarkOptions"></div></div>
</div>
</div>
<div class="modal-actions">
<button class="btn-modal delete" id="editDeleteBtn">删除</button>
<div class="modal-actions-right">
<button class="btn-modal cancel" id="editCancelBtn">取消</button>
<button class="btn-modal save" id="editSaveBtn">保存</button>
</div>
</div>
</div>
</div>

<div class="config-overlay hidden" id="configModal">
<div class="config-box">
<div class="config-scroll">
<h3>GitHub 云端配置</h3>
<div class="config-desc">配置后数据将保存到您的 GitHub 仓库，在任何设备上打开都能同步。</div>

<div class="form-group">
<label for="cfgToken">GitHub Personal Access Token *</label>
<input type="password" id="cfgToken" name="github-token" autocomplete="current-password" spellcheck="false" placeholder="ghp_xxxxxxxxxxxx">
<label class="token-save-option" for="cfgRememberToken">
<input type="checkbox" id="cfgRememberToken" checked>

function openDb(){
if(dbPromise)return dbPromise;

dbPromise=new Promise((resolve,reject)=>{
const request=indexedDB.open(DB_NAME,DB_VERSION);

request.onupgradeneeded=()=>{
const db=request.result;
if(!db.objectStoreNames.contains(DB_STORE))db.createObjectStore(DB_STORE)
};

request.onsuccess=()=>resolve(request.result);
request.onerror=()=>reject(request.error||new Error('IndexedDB 打开失败'));
request.onblocked=()=>console.warn('IndexedDB 升级被其他页面阻塞')
});

return dbPromise
}

async function idbGet(key){
const db=await openDb();

return new Promise((resolve,reject)=>{
const tx=db.transaction(DB_STORE,'readonly'),
req=tx.objectStore(DB_STORE).get(key);

req.onsuccess=()=>resolve(req.result);
req.onerror=()=>reject(req.error||new Error('IndexedDB 读取失败'))
})
}

async function idbSet(key,value){
const db=await openDb();

return new Promise((resolve,reject)=>{
const tx=db.transaction(DB_STORE,'readwrite');

tx.objectStore(DB_STORE).put(value,key);
tx.oncomplete=()=>resolve();
tx.onerror=()=>reject(tx.error||new Error('IndexedDB 写入失败'));
tx.onabort=()=>reject(tx.error||new Error('IndexedDB 写入中止'))
})
}

async function idbDelete(key){
const db=await openDb();

return new Promise((resolve,reject)=>{
const tx=db.transaction(DB_STORE,'readwrite');

tx.objectStore(DB_STORE).delete(key);
tx.oncomplete=()=>resolve();
tx.onerror=()=>reject(tx.error||new Error('IndexedDB 删除失败'));
tx.onabort=()=>reject(tx.error||new Error('IndexedDB 写入中止'))
})
}

function isValidWorkingCopy(record){
return Boolean(
record &&
(record.version===1||record.version===2) &&
Array.isArray(record.pages) &&
Number.isFinite(Number(record.savedAt))
)
}

async function readOpfsWorkingCopy(){
if(!navigator.storage?.getDirectory)throw new Error('OPFS 不可用');

const root=await navigator.storage.getDirectory(),
handle=await root.getFileHandle(OPFS_WORKING_COPY_FILE),
file=await handle.getFile();

return JSON.parse(await file.text())
}

async function writeOpfsWorkingCopy(record){
if(!navigator.storage?.getDirectory)throw new Error('OPFS 不可用');

const root=await navigator.storage.getDirectory(),
handle=await root.getFileHandle(OPFS_WORKING_COPY_FILE,{create:true}),
writer=await handle.createWritable();

try{
await writer.write(JSON.stringify(record));
await writer.close()
}catch(error){
try{await writer.abort()}catch{}
throw error
}
}

async function persistWorkingCopy(record){
const results=await Promise.allSettled([
idbSet(WORKING_COPY_KEY,record),
writeOpfsWorkingCopy(record)
]);

if(!results.some(result=>result.status==='fulfilled')){
throw new Error('IndexedDB 与 OPFS 均保存失败')
}
}

function saveWorkingCopy(){
const snapshot=getLocalSnapshot(),
record={
version:2,
savedAt:Date.now(),
revision:++workingCopyRevision,
pages:structuredClone(snapshot.pages),
tombstones:structuredClone(snapshot.tombstones)
};

workingCopyQueue=workingCopyQueue
.catch(()=>{})
.then(()=>persistWorkingCopy(record))
.catch(error=>console.error('保存 Pages 工作副本失败:',error));

return workingCopyQueue
}

async function readBestWorkingCopy(){
let idbRecord=null,
opfsRecord=null;

try{
idbRecord=await idbGet(WORKING_COPY_KEY)
}catch(error){
console.warn('读取 IndexedDB 工作副本失败:',error)
}

try{
opfsRecord=await readOpfsWorkingCopy()
}catch(error){
if(error?.name!=='NotFoundError'){
console.warn('读取 OPFS 工作副本失败:',error)
}
}

const valid=[idbRecord,opfsRecord]
.filter(isValidWorkingCopy)
.sort((a,b)=>Number(b.savedAt)-Number(a.savedAt));

const best=valid[0]||null;

if(best){
const repairs=await Promise.allSettled([
idbSet(WORKING_COPY_KEY,best),
writeOpfsWorkingCopy(best)
]);

if(repairs.every(result=>result.status==='rejected')){
console.warn('工作副本恢复后无法重新建立本地双副本')
}
}

return best
}

function normalizeSortText(v){
return typeof v==='string'
?v.normalize('NFKC').trim()
:''
}

function getStructuredSortInfo(v){
const text=normalizeSortText(v);

if(!text){
return{type:99,text:'',dateKey:null,numberKey:null}
}

const dm=text.match(/^(\d{4})-(\d{2})-(\d{2})$/);

if(dm){
const y=Number(dm[1]),
m=Number(dm[2]),
d=Number(dm[3]),
date=new Date(Date.UTC(y,m-1,d));

if(
date.getUTCFullYear()===y &&
date.getUTCMonth()===m-1 &&
date.getUTCDate()===d
){
return{
type:0,
text,
dateKey:y*10000+m*100+d,
numberKey:null
}
}
}

if(/^https?:\/\//i.test(text)){
return{type:5,text,dateKey:null,numberKey:null}
}

const first=Array.from(text)[0]||'';

if(/^\p{Script=Han}$/u.test(first)){
return{type:1,text,dateKey:null,numberKey:null}
}

if(/^[A-Za-z]$/.test(first)){
return{type:2,text,dateKey:null,numberKey:null}
}

const nm=text.match(/^[+-]?(?:\d+(?:\.\d+)?|\.\d+)/);

if(nm){
return{
type:3,
text,
dateKey:null,
numberKey:Number(nm[0])
}
}

return{type:4,text,dateKey:null,numberKey:null}
}

function compareStructuredText(a0,b0){
const a=getStructuredSortInfo(a0),
b=getStructuredSortInfo(b0);

if(a.type!==b.type)return a.type-b.type;

if(a.type===0&&a.dateKey!==b.dateKey){
return a.dateKey-b.dateKey
}

if(a.type===1){
let r=pinyinCollator.compare(a.text,b.text);
if(r!==0)return r;

r=strokeCollator.compare(a.text,b.text);
if(r!==0)return r
}

if(a.type===2){
const r=a.text.localeCompare(
b.text,
'en',
{sensitivity:'base',numeric:true}
);

if(r!==0)return r
}

if(a.type===3&&a.numberKey!==b.numberKey){
return a.numberKey-b.numberKey
}

const r=generalCollator.compare(a.text,b.text);

if(r!==0)return r;

return a.text<b.text?-1:a.text>b.text?1:0
}

function normalizeRemarkValue(v){
return typeof v==='string'
?v.normalize('NFC').trim()
:''
}

function remarkHistoryKey(v){
return normalizeRemarkValue(v)
.toLocaleLowerCase('zh-CN')
}

function normalizeRemarks(v){
const seen=new Set();

return(Array.isArray(v)?v:[v])
.map(normalizeRemarkValue)
.filter(item=>{
const k=remarkHistoryKey(item);

if(!item||seen.has(k))return false;

seen.add(k);
return true
})
}

function getRemarkSortInfo(v){
const text=normalizeRemarkValue(v),
first=Array.from(text)[0]||'';

if(/^\p{Script=Han}$/u.test(first)){
return{type:0,text,dateKey:null,numberKey:null}
}

if(/^[A-Za-z]$/.test(first)){
return{type:1,text,dateKey:null,numberKey:null}
}

const dm=text.match(/^(\d{4})-(\d{2})-(\d{2})$/);

if(dm){
const y=Number(dm[1]),
m=Number(dm[2]),
d=Number(dm[3]),
date=new Date(Date.UTC(y,m-1,d));

if(
date.getUTCFullYear()===y &&
date.getUTCMonth()===m-1 &&
date.getUTCDate()===d
){
return{
type:3,
text,
dateKey:y*10000+m*100+d,
numberKey:null
}
}
}

const nm=text.match(/^(\d+(?:\.\d+)?)/);

if(nm){
return{
type:2,
text,
dateKey:null,
numberKey:Number(nm[1])
}
}

return{type:4,text,dateKey:null,numberKey:null}
}

function getBracketedNumberInfo(value){
const text=normalizeRemarkValue(value),
numberPattern=/【\s*([+-]?(?:\d+(?:\.\d+)?|\.\d+))\s*】/,
match=text.match(numberPattern),
withoutNumber=text
.replace(/【\s*[+-]?(?:\d+(?:\.\d+)?|\.\d+)\s*】/g,' ')
.replace(/\s+/g,' ')
.trim();

return{
hasNumber:Boolean(match),
number:match?Number(match[1]):null,
text,
withoutNumber
}
}

function compareRemarkOptionsBase(a0,b0){
const a=getRemarkSortInfo(a0),
b=getRemarkSortInfo(b0);

if(a.type!==b.type)return a.type-b.type;

if(a.type===0){
let r=pinyinCollator.compare(a.text,b.text);
if(r!==0)return r;

r=strokeCollator.compare(a.text,b.text);
if(r!==0)return r
}else if(a.type===1){
const r=a.text.localeCompare(
b.text,
'en',
{sensitivity:'base',numeric:true}
);

if(r!==0)return r
}else if(a.type===2){
if(a.numberKey!==b.numberKey){
return a.numberKey-b.numberKey
}

const r=a.text.localeCompare(
b.text,
'zh-CN',
{sensitivity:'base',numeric:true}
);

if(r!==0)return r
}else if(a.type===3&&a.dateKey!==b.dateKey){
return a.dateKey-b.dateKey
}

const r=generalCollator.compare(a.text,b.text);

if(r!==0)return r;

return a.text<b.text?-1:a.text>b.text?1:0
}

function compareLabelByBracketedNumber(a0,b0,baseComparator){
const a=getBracketedNumberInfo(a0),
b=getBracketedNumberInfo(b0);

if(a.hasNumber!==b.hasNumber){
return a.hasNumber?-1:1
}

if(a.hasNumber&&b.hasNumber){
if(a.number!==b.number){
return b.number-a.number
}

const r=baseComparator(
a.withoutNumber,
b.withoutNumber
);

if(r!==0)return r;

return baseComparator(
a.text,
b.text
)
}

return baseComparator(
a.text,
b.text
)
}

function compareRemarkOptions(a0,b0){
return compareLabelByBracketedNumber(
a0,
b0,
compareRemarkOptionsBase
)
}

function saveRemarkHidden(){
persistRemarkHidden()
}

function saveRemarkHistory(){
persistRemarkHistory()
}

function rebuildRemarkHistory(){
const seen=new Map(),
candidates=[...remarkHistory];

pages.forEach(item=>{
candidates.push(...normalizeRemarks(item&&item.remark))
});

candidates.forEach(raw=>{
const value=normalizeRemarkValue(raw),
k=remarkHistoryKey(value);

if(
value &&
!remarkHidden.has(k) &&
!seen.has(k)
){
seen.set(k,value)
}
});

remarkHistory=[...seen.values()]
.sort(compareRemarkOptions);

saveRemarkHistory()
}

function rememberRemark(v){
if(Array.isArray(v)){
v.forEach(rememberRemark);
return
}

const n=normalizeRemarkValue(v);

if(!n)return;

const k=remarkHistoryKey(n);

if(remarkHidden.delete(k)){
saveRemarkHidden()
}

if(
!remarkHistory.some(
item=>remarkHistoryKey(item)===k
)
){
remarkHistory.push(n);
remarkHistory.sort(compareRemarkOptions);
saveRemarkHistory()
}
}

function setupRemarkCombo({
input,
dropdown,
options,
combo,
submit,
manageOptions=false
}){
let selected=[],
filtered=[],
activeIndex=-1,
suppressMenuOpen=false;

const tags=document.createElement('div');
tags.className='remark-tags';
combo.insertBefore(tags,input);

input.removeAttribute('placeholder');
options.setAttribute('role','listbox');
options.setAttribute('aria-multiselectable','true');

function closeMenu(){
dropdown.classList.add('hidden');
input.setAttribute('aria-expanded','false');
activeIndex=-1
}

function renderTags(){
tags.replaceChildren();

selected.forEach((value,index)=>{
const tag=document.createElement('span');
tag.className='remark-tag';

const label=document.createElement('span');
label.textContent=value;

const remove=document.createElement('button');
remove.type='button';
remove.className='remark-remove';
remove.textContent='×';
remove.setAttribute('aria-label','移除备注：'+value);

remove.addEventListener('click',()=>{
selected.splice(index,1);
renderTags();
input.focus();
renderMenu(true)
});

tag.append(label,remove);
tags.append(tag)
})
}

function add(value){
selected=normalizeRemarks([
...selected,
value
]);

input.value='';
renderTags()
}

function choose(value){
const index=selected.findIndex(
item=>
remarkHistoryKey(item)===
remarkHistoryKey(value)
);

if(index>=0){
selected.splice(index,1)
}else{
add(value)
}

input.value='';
renderTags();
suppressMenuOpen=true;
closeMenu();
input.focus({preventScroll:true});
closeMenu();

setTimeout(()=>{
closeMenu();
suppressMenuOpen=false
},0)
}

function setActive(index){
activeIndex=filtered.length
?(index+filtered.length)%filtered.length
:-1;

[...options.children].forEach((node,i)=>{
const button=node.matches('.remark-option')
?node
:node.querySelector('.remark-option');

if(button){
button.classList.toggle(
'is-active',
i===activeIndex
)
}
});

if(activeIndex>=0){
const node=options.children[activeIndex];

if(node){
node.scrollIntoView({block:'nearest'})
}
}
}

function renameHistoryOption(oldValue){
const oldNormalized=normalizeRemarkValue(oldValue);

if(!oldNormalized)return;

const result=prompt(
'修改备注选项：',
oldNormalized
);

if(result===null)return;

const newNormalized=normalizeRemarkValue(result);

if(!newNormalized){
alert('备注选项不能为空。');
return
}

const oldKey=remarkHistoryKey(oldNormalized),
newKey=remarkHistoryKey(newNormalized);

if(
newKey!==oldKey &&
remarkHistory.some(
item=>remarkHistoryKey(item)===newKey
)
){
alert('该备注选项已经存在。');
return
}

pages.forEach(item=>{
if(!item)return;

item.remark=normalizeRemarks(item.remark)
.map(
remark=>
remarkHistoryKey(remark)===oldKey
?newNormalized
:remark
);

item.remark=normalizeRemarks(item.remark)
});

remarkHidden.add(oldKey);
remarkHidden.delete(newKey);

remarkHistory=remarkHistory.filter(
item=>
remarkHistoryKey(item)!==oldKey &&
remarkHistoryKey(item)!==newKey
);

remarkHistory.push(newNormalized);
remarkHistory.sort(compareRemarkOptions);

selected=normalizeRemarks(
selected.map(
item=>
remarkHistoryKey(item)===oldKey
?newNormalized
:item
)
);

saveRemarkHidden();
saveRemarkHistory();

input.value='';
renderTags();
closeMenu();
applySortAndRender();
markLocalChange()
}

function deleteHistoryOption(value){
const normalized=normalizeRemarkValue(value);

if(!normalized)return;

if(
!confirm(
`确定删除备注“${normalized}”吗？\n该备注会同时从总表中所有已保存条目里移除。`
)
){
return
}

const k=remarkHistoryKey(normalized);

pages.forEach(item=>{
if(!item)return;

item.remark=normalizeRemarks(item.remark)
.filter(
remark=>
remarkHistoryKey(remark)!==k
)
});

remarkHidden.add(k);

remarkHistory=remarkHistory.filter(
item=>
remarkHistoryKey(item)!==k
);

selected=selected.filter(
item=>
remarkHistoryKey(item)!==k
);

saveRemarkHidden();
saveRemarkHistory();

input.value='';
renderTags();
closeMenu();
applySortAndRender();
markLocalChange()
}

function createOptionButton(value,checked){
const button=document.createElement('button');

button.type='button';
button.className='remark-option';
button.textContent=(checked?'✓ ':'')+value;
button.setAttribute('role','option');
button.setAttribute('aria-selected',String(checked));

button.addEventListener('click',event=>{
event.preventDefault();
event.stopPropagation();
choose(value)
});

return button
}

function renderMenu(forceOpen=false){
const query=remarkHistoryKey(input.value);

filtered=remarkHistory.filter(
item=>
remarkHistoryKey(item).includes(query)
);

if(
query &&
!filtered.some(
item=>remarkHistoryKey(item)===query
)
){
filtered.unshift(
normalizeRemarkValue(input.value)
)
}

options.replaceChildren();

filtered.forEach(value=>{
const checked=selected.some(
item=>
remarkHistoryKey(item)===
remarkHistoryKey(value)
);

const optionButton=createOptionButton(
value,
checked
);

if(!manageOptions){
options.append(optionButton);
return
}

const row=document.createElement('div');
row.className='remark-option-row';

const actions=document.createElement('div');
actions.className='remark-option-actions';

const editButton=document.createElement('button');
editButton.type='button';
editButton.className='remark-manage-btn edit';
editButton.textContent='改';
editButton.setAttribute(
'aria-label',
'修改备注选项：'+value
);

editButton.addEventListener('click',event=>{
event.preventDefault();
event.stopPropagation();
renameHistoryOption(value)
});

const deleteButton=document.createElement('button');
deleteButton.type='button';
deleteButton.className='remark-manage-btn delete';
deleteButton.textContent='删';
deleteButton.setAttribute(
'aria-label',
'删除备注选项：'+value
);

deleteButton.addEventListener('click',event=>{
event.preventDefault();
event.stopPropagation();
deleteHistoryOption(value)
});

actions.append(editButton,deleteButton);
row.append(optionButton,actions);
options.append(row)
});

function getRemarkDateSortKey(value){
const text=normalizeSortText(value),
match=text.match(/^(\d{4})-(\d{2})-(\d{2})$/);

if(!match)return Number.POSITIVE_INFINITY;

const y=Number(match[1]),
m=Number(match[2]),
d=Number(match[3]),
date=new Date(Date.UTC(y,m-1,d));

if(
date.getUTCFullYear()!==y ||
date.getUTCMonth()!==m-1 ||
date.getUTCDate()!==d
){
return Number.POSITIVE_INFINITY
}

return y*10000+m*100+d
}

function compareFirstRemarkTextBase(a0,b0){
function info(value){
const text=normalizeSortText(value);

if(!text){
return{type:99,text:'',numberKey:null}
}

if(/^https?:\/\//i.test(text)){
return{type:5,text,numberKey:null}
}

const first=Array.from(text)[0]||'';

if(/^\p{Script=Han}$/u.test(first)){
return{type:1,text,numberKey:null}
}

if(/^[A-Za-z]$/.test(first)){
return{type:2,text,numberKey:null}
}

const nm=text.match(
/^[+-]?(?:\d+(?:\.\d+)?|\.\d+)/
);

if(nm){
return{
type:3,
text,
numberKey:Number(nm[0])
}
}

return{type:4,text,numberKey:null}
}

const a=info(a0),
b=info(b0);

if(a.type!==b.type)return a.type-b.type;

if(a.type===1){
let r=pinyinCollator.compare(a.text,b.text);

if(r!==0)return r;

r=strokeCollator.compare(a.text,b.text);

if(r!==0)return r
}

if(a.type===2){
const r=a.text.localeCompare(
b.text,
'en',
{sensitivity:'base',numeric:true}
);

if(r!==0)return r
}

if(a.type===3&&a.numberKey!==b.numberKey){
return a.numberKey-b.numberKey
}

const r=generalCollator.compare(
a.text,
b.text
);

if(r!==0)return r;

return a.text<b.text?-1:a.text>b.text?1:0
}

function compareFirstRemarkText(a0,b0){
return compareLabelByBracketedNumber(
a0,
b0,
compareFirstRemarkTextBase
)
}

function compareStructuredRemarkText(a0,b0){
return compareLabelByBracketedNumber(
a0,
b0,
compareStructuredText
)
}

function compareLegacyPages(a,b){
const ar=normalizeRemarks(a&&a.remark),
br=normalizeRemarks(b&&b.remark),
a1=ar[0]||'',
b1=br[0]||'',
a2=ar[1]||'',
b2=br[1]||'',
ha2=Boolean(a2),
hb2=Boolean(b2),
ha1=Boolean(a1),
hb1=Boolean(b1);

if(ha2!==hb2){
return ha2?-1:1
}

if(ha2&&hb2){
const ad=getRemarkDateSortKey(a2),
bd=getRemarkDateSortKey(b2);

if(ad!==bd)return ad-bd;

const r1=compareFirstRemarkText(a1,b1);

if(r1!==0)return r1;

if(!Number.isFinite(ad)){
const r2=compareStructuredRemarkText(a2,b2);
if(r2!==0)return r2
}

return compareStructuredText(
a&&a.title,
b&&b.title
)
}

if(ha1!==hb1){
return ha1?-1:1
}

if(ha1&&hb1){
const r=compareFirstRemarkText(a1,b1);

if(r!==0)return r;

return compareStructuredText(
a&&a.title,
b&&b.title
)
}

return compareStructuredText(
a&&a.title,
b&&b.title
)
}

function compareRemarkLabelText(a0,b0){
const aText=normalizeRemarkValue(a0),
bText=normalizeRemarkValue(b0);

if(!aText&&!bText)return 0;
if(!aText)return 1;
if(!bText)return -1;

const a=getStructuredSortInfo(aText),
b=getStructuredSortInfo(bText);

const rank=info=>
info.type===0?0:
info.type===1?1:
info.type===2?2:
info.type===3?3:
info.type===5?4:
5;

const aRank=rank(a),
bRank=rank(b);

if(aRank!==bRank){
return aRank-bRank
}

if(
a.type===0 &&
a.dateKey!==b.dateKey
){
return a.dateKey-b.dateKey
}

return compareLabelByBracketedNumber(
aText,
bText,
compareStructuredText
)
}

function sortPages(){
pages.sort((a,b)=>{
const ar=normalizeRemarks(a&&a.remark),
br=normalizeRemarks(b&&b.remark),
a1=ar[0]||'',
b1=br[0]||'',
a2=ar[1]||'',
b2=br[1]||'';

const r1=compareRemarkLabelText(
a1,
b1
);

if(r1!==0)return r1;

const r2=compareRemarkLabelText(
a2,
b2
);

if(r2!==0)return r2;

return compareStructuredText(
a&&a.title,
b&&b.title
)
})
}

function parsePageInput(input){

match=raw.match(

if(match){

function escapeHtml(text){

}

function cloneValue(value){
return value==null
?value
:structuredClone(value)
}

function hashString(value){
let h1=2166136261,
h2=2246822519;

const text=String(value);

for(let i=0;i<text.length;i++){
const code=text.charCodeAt(i);

h1^=code;
h1=Math.imul(h1,16777619);

h2^=code;
h2=Math.imul(h2,3266489917);
h2^=h2>>>13
}

return`${(h1>>>0).toString(36)}${(h2>>>0).toString(36)}`
}

function createPageId(){
if(globalThis.crypto?.randomUUID){
return crypto.randomUUID()
}

return`p-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,10)}-${Math.random().toString(36).slice(2,8)}`
}

function legacyPageIdentity(item){
const title=String(item?.title||'')
.normalize('NFC')
.trim(),
url=String(item?.url||'').trim();

return url
?`url:${url}`
:`title:${title}`
}

function normalizePageArray(items){
const source=Array.isArray(items)?items:[],
counts=new Map(),
used=new Set(),
result=[];

source.forEach(raw=>{
if(
!raw ||
raw.__pagesDeleted===true ||
raw.deleted===true
){
return
}

const title=String(raw.title||'')
.normalize('NFC')
.trim();

if(!title)return;

const identity=legacyPageIdentity(raw),
occurrence=(counts.get(identity)||0)+1;

counts.set(identity,occurrence);

let id=
typeof raw.id==='string' &&
raw.id.trim()
?raw.id.trim()
:`legacy-${hashString(identity)}-${occurrence}`;

if(used.has(id)){
id=`${id}-${hashString(JSON.stringify(raw))}`
}

while(used.has(id)){
id=`${id}-x`
}

used.add(id);

const url=String(raw.url||'').trim(),
titleMode=
['markdown','url','text']
.includes(raw.titleMode)
?raw.titleMode
:(
url
?(
title===url
?'url'
:'markdown'
)
:'text'
);

result.push({
id,
title,
url,
titleMode,
note:String(raw.note||'').normalize('NFC').trim(),
remark:normalizeRemarks(raw.remark)
})
});

return result
}

function normalizeTombstones(items){
const map=new Map();

(Array.isArray(items)?items:[])
.forEach(raw=>{
if(!raw)return;

const id=String(raw.id||'').trim();

if(!id)return;

const deletedAt=
Number.isFinite(Number(raw.deletedAt))
?Number(raw.deletedAt)
:0;

const previous=map.get(id);

if(
!previous ||
deletedAt>previous.deletedAt
){
map.set(id,{id,deletedAt})
}
});

return[...map.values()]
}

function normalizeSnapshot(payload){
let rawPages=[],
rawTombstones=[];

if(Array.isArray(payload)){
rawPages=payload.filter(
item=>
item &&
item.__pagesDeleted!==true &&
item.deleted!==true
);

rawTombstones=payload.filter(
item=>
item &&
(
item.__pagesDeleted===true ||
item.deleted===true
)
)
}else if(
payload &&
typeof payload==='object'
){
rawPages=Array.isArray(payload.pages)
?payload.pages
:[];

rawTombstones=Array.isArray(payload.tombstones)
?payload.tombstones
:[]
}

const normalizedPages=normalizePageArray(rawPages),
normalizedTombstones=normalizeTombstones(rawTombstones),
deletedIds=new Set(
normalizedTombstones.map(item=>item.id)
);

return{
pages:normalizedPages.filter(
item=>!deletedIds.has(item.id)
),
tombstones:normalizedTombstones
}
}

})
}

){

}

function pageComparable(item){
if(!item)return null;

return{
id:item.id,
title:item.title,
url:item.url,
titleMode:item.titleMode,
note:item.note,
remark:normalizeRemarks(item.remark)
}
}

function canonicalSnapshot(snapshot){
const normalized=normalizeSnapshot(snapshot);

return{
pages:normalized.pages
.map(pageComparable)
.sort((a,b)=>a.id.localeCompare(b.id)),
tombstones:normalized.tombstones
.map(item=>({
id:item.id,
deletedAt:Number(item.deletedAt)||0
}))
.sort((a,b)=>a.id.localeCompare(b.id))
}
}

function getFingerprint(snapshot){
const raw=JSON.stringify(
canonicalSnapshot(snapshot)
);

return`${raw.length}:${hashString(raw)}`
}

function makeRemotePayload(snapshot){
const normalized=normalizeSnapshot(snapshot);

return[
...normalized.pages.map(pageComparable),
...normalized.tombstones.map(item=>({
id:item.id,
__pagesDeleted:true,
deletedAt:Number(item.deletedAt)||0
}))
]
}

function assertSyncSize(snapshot){

makeRemotePayload(snapshot),

2

if(
new TextEncoder()
.encode(raw)
.length >
MAX_SYNC_BYTES
){
throw new Error(
'数据超过 750 KB 同步上限'
)
}

return raw
}

function upsertTombstone(id,deletedAt=Date.now()){
const key=String(id||'').trim();

if(!key)return;

const existing=tombstones.find(
item=>item.id===key
);

if(existing){
existing.deletedAt=Math.max(
Number(existing.deletedAt)||0,
Number(deletedAt)||Date.now()
)
}else{
tombstones.push({
id:key,
deletedAt:Number(deletedAt)||Date.now()
})
}
}

async function loadSyncState(){

storedBase=null;

try{

]=await Promise.all([

){

:'',

:null,

fingerprint:

?storedMeta.fingerprint

:null
}

:idbDelete(

)

}

function valuesEqual(a,b){
return JSON.stringify(a)===
JSON.stringify(b)
}

function mergeRemarkValues(
baseValue,
localValue,
remoteValue
){
const base=normalizeRemarks(baseValue),
local=normalizeRemarks(localValue),
remote=normalizeRemarks(remoteValue),
key=value=>remarkHistoryKey(value),
baseKeys=new Set(base.map(key)),
localKeys=new Set(local.map(key)),
remoteKeys=new Set(remote.map(key)),
removed=new Set(),
result=[];

base.forEach(value=>{
const k=key(value);

if(
!localKeys.has(k) ||
!remoteKeys.has(k)
){
removed.add(k)
}
});

base.forEach(value=>{
if(!removed.has(key(value))){
result.push(value)
}
});

[
...local,
...remote
]
.forEach(value=>{
const k=key(value);

if(
!baseKeys.has(k) &&
!result.some(
item=>key(item)===k
)
){
result.push(value)
}
});

return normalizeRemarks(result)
}

function entityMap(snapshot){
const normalized=normalizeSnapshot(snapshot),
map=new Map();

normalized.pages.forEach(item=>{
map.set(item.id,{
kind:'page',
value:item
})
});

normalized.tombstones.forEach(item=>{
map.set(item.id,{
kind:'deleted',
value:item
})
});

return map
}

function entityEqual(a,b){
if(!a&&!b)return true;

if(
!a ||
!b ||
a.kind!==b.kind
){
return false
}

if(a.kind==='deleted'){
return true
}

return valuesEqual(
pageComparable(a.value),
pageComparable(b.value)
)
}

function mergePageRecord(
id,
base,
local,
remote,
preference,
conflicts
){
const merged={id},
scalarFields=[
'title',
'url',
'titleMode',
'note'
];

scalarFields.forEach(field=>{
const b=base?.[field],
l=local?.[field],
r=remote?.[field];

if(valuesEqual(l,r)){
merged[field]=cloneValue(l)
}else if(
base &&
valuesEqual(l,b)
){
merged[field]=cloneValue(r)
}else if(
base &&
valuesEqual(r,b)
){
merged[field]=cloneValue(l)
}else{
conflicts.push({
id,
field,
local:cloneValue(l),
remote:cloneValue(r)
});

merged[field]=cloneValue(
preference==='remote'
?r
:l
)
}
});

const bRemarks=base?.remark||[],
lRemarks=local?.remark||[],
rRemarks=remote?.remark||[];

if(valuesEqual(lRemarks,rRemarks)){
merged.remark=normalizeRemarks(lRemarks)
}else if(
base &&
valuesEqual(lRemarks,bRemarks)
){
merged.remark=normalizeRemarks(rRemarks)
}else if(
base &&
valuesEqual(rRemarks,bRemarks)
){
merged.remark=normalizeRemarks(lRemarks)
}else{
merged.remark=mergeRemarkValues(
bRemarks,
lRemarks,
rRemarks
)
}

return normalizePageArray([merged])[0]||null
}

function mergeSnapshots(
baseSnapshot,
localSnapshot,
remoteSnapshot,
preference=null
){
const baseMap=entityMap(
baseSnapshot||{
pages:[],
tombstones:[]
}
),
localMap=entityMap(localSnapshot),
remoteMap=entityMap(remoteSnapshot),
ids=new Set([
...baseMap.keys(),
...localMap.keys(),
...remoteMap.keys()
]),
conflicts=[],
pagesOut=[],
tombstonesOut=[],
now=Date.now();

const deletedEntity=(id,source=null)=>({
kind:'deleted',
value:{
id,
deletedAt:
Number(source?.value?.deletedAt)||
now
}
});

const chooseConflict=(id,field,l,r)=>{
conflicts.push({
id,
field,
local:l,
remote:r
});

return preference==='remote'
?r
:l
};

for(const id of ids){
let b=baseMap.get(id)||null,
l=localMap.get(id)||null,
r=remoteMap.get(id)||null;

if(b?.kind==='page'){
if(!l)l=deletedEntity(id);
if(!r)r=deletedEntity(id)
}else if(b?.kind==='deleted'){
if(!l)l=b;
if(!r)r=b
}

let chosen=null;

if(entityEqual(l,r)){
if(
l?.kind==='deleted' &&
r?.kind==='deleted'
){
chosen=deletedEntity(id,{
value:{
deletedAt:Math.max(
Number(l.value.deletedAt)||0,
Number(r.value.deletedAt)||0
)
}
})
}else{
chosen=l||r
}
}else if(entityEqual(l,b)){
chosen=r
}else if(entityEqual(r,b)){
chosen=l
}else if(!b){
if(!l){
chosen=r
}else if(!r){
chosen=l
}else if(
l.kind==='page' &&
r.kind==='page'
){
chosen={
kind:'page',
value:mergePageRecord(
id,
null,
l.value,
r.value,
preference,
conflicts
)
}
}else{
chosen=chooseConflict(
id,
'__delete__',
l,
r
)
}
}else if(
l?.kind==='deleted' &&
r?.kind==='deleted'
){
chosen=deletedEntity(id,{
value:{
deletedAt:Math.max(
Number(l.value.deletedAt)||0,
Number(r.value.deletedAt)||0
)
}
})
}else if(
l?.kind==='page' &&
r?.kind==='page'
){
chosen={
kind:'page',
value:mergePageRecord(
id,
b.kind==='page'
?b.value
:null,
l.value,
r.value,
preference,
conflicts
)
}
}else{
chosen=chooseConflict(
id,
'__delete__',
l,
r
)
}

if(!chosen)continue;

if(chosen.kind==='deleted'){
tombstonesOut.push({
id,
deletedAt:
Number(chosen.value.deletedAt)||
now
})
}else if(chosen.value){
pagesOut.push(chosen.value)
}
}

return{
snapshot:normalizeSnapshot({
pages:pagesOut,
tombstones:tombstonesOut
}),
conflicts
}
}

function utf8ToBase64(text){
const bytes=new TextEncoder().encode(text);

let binary='';

for(
let offset=0;
offset<bytes.length;
offset+=0x8000
){
binary+=String.fromCharCode(
...bytes.subarray(
offset,
offset+0x8000
)
)
}

return btoa(binary)
}

function base64ToUtf8(base64){
const binary=atob(
String(base64||'')
.replace(/\s/g,'')
),
bytes=new Uint8Array(binary.length);

for(let i=0;i<binary.length;i++){
bytes[i]=binary.charCodeAt(i)
}

return new TextDecoder(
'utf-8',
{fatal:true}
)
.decode(bytes)
}

async function githubApi(method,endpoint,body=null){
const url=
`https://api.github.com/repos/${encodeURIComponent(config.owner)}/${encodeURIComponent(config.repo)}/${endpoint}`;

const headers={
'Authorization':`token ${config.token}`,
'Accept':'application/vnd.github+json'
};

const options={
method,
headers
};

if(body!==null){
headers['Content-Type']='application/json';
options.body=JSON.stringify(body)
}

const response=await fetch(
url,
options
);

const raw=await response.text();

let payload=null;

if(raw){
try{
payload=JSON.parse(raw)
}catch(error){
payload={message:raw}
}
}

if(!response.ok){
const error=new Error(
payload?.message||
`HTTP ${response.status}`
);

error.status=response.status;

throw error
}

return payload
}

async function readRemoteState(){
if(!isConfigValid()){
throw new Error(
'请先配置 GitHub 连接'
)
}

try{
const data=await githubApi(
'GET',
`contents/${String(config.file).split('/').filter(Boolean).map(encodeURIComponent).join('/')}`
);

if(
!data ||
data.type!=='file' ||
!data.sha ||
!data.content
){
throw new Error(
'云端文件无法安全读取'
)
}

if(
Number.isFinite(Number(data.size)) &&
Number(data.size)>MAX_SYNC_BYTES
){
throw new Error(
'云端文件超过 750 KB 同步上限'
)
}

const parsed=JSON.parse(
base64ToUtf8(data.content)
);

const state=normalizeSnapshot(parsed);

const rawItems=Array.isArray(parsed)
?parsed
:(
Array.isArray(parsed?.pages)
?parsed.pages
:[]
);

const needsMigration=
!Array.isArray(parsed) ||
rawItems.some(
item=>
item &&
item.__pagesDeleted!==true &&
item.deleted!==true &&
!(
typeof item.id==='string' &&
item.id.trim()
)
);

assertSyncSize(state);

return{
exists:true,
sha:data.sha,
state,
needsMigration
}
}catch(error){
if(error?.status===404){
return{
exists:false,
sha:null,
state:{
pages:[],
tombstones:[]
}
}
}

throw error
}
}

async function writeRemoteState(
snapshot,
sha=null
){
const raw=assertSyncSize(snapshot);

const body={
message:
`更新 Pages 数据 - ${new Date().toLocaleString()}`,
content:utf8ToBase64(raw)
};

if(sha){
body.sha=sha
}

const result=await githubApi(
'PUT',
`contents/${String(config.file).split('/').filter(Boolean).map(encodeURIComponent).join('/')}`,
body
);

return result?.content?.sha||null
}

async function persistSyncedBase(
snapshot,
sha
){
const normalized=normalizeSnapshot(snapshot),
baseFingerprint=getFingerprint(normalized),
currentFingerprint=getFingerprint(
getLocalSnapshot()
);

syncBase=normalized;

syncMeta={
target:getSyncTarget(),
sha:sha||null,
fingerprint:baseFingerprint,
dirty:
currentFingerprint!==baseFingerprint,
lastSyncAt:
new Date().toISOString()
};

await persistSyncState();
updateLastSyncDisplay()
}

async function finalizeSyncedState(
syncedSnapshot,
sha,
localAtStart,
mutationAtStart,
{applySynced=true}={}
){
const normalizedSynced=
normalizeSnapshot(syncedSnapshot);

if(
localMutationVersion===
mutationAtStart
){
if(applySynced){
applySnapshot(normalizedSynced)
}

await persistSyncedBase(
normalizedSynced,
sha
);

return
}

const current=getLocalSnapshot();

const rebased=mergeSnapshots(
localAtStart,
current,
normalizedSynced,
'local'
).snapshot;

applySnapshot(rebased);

await persistSyncedBase(
normalizedSynced,
sha
);

syncMeta.dirty=true;

await persistSyncMeta();

syncRequested=true;

setCloudStatus(
'offline',
'待同步'
);

lastSyncTime.textContent=
'有未同步修改'
}

async function performSync({
showMessage=true,
interactive=showMessage
}={}){
ensureSyncTarget();

const localAtStart=getLocalSnapshot(),
mutationAtStart=localMutationVersion,
localFingerprint=getFingerprint(localAtStart),
baselineFingerprint=syncMeta.fingerprint,
hasBaseline=Boolean(
syncBase &&
typeof baselineFingerprint==='string'
);

setCloudStatus(
'syncing',
'同步中...'
);

let conflictPreference=null;

for(
let attempt=0;
attempt<MAX_WRITE_CONFLICT_RETRIES;
attempt++
){
const remote=
await readRemoteState();

if(!remote.exists){
if(
hasBaseline &&
!interactive
){
setCloudStatus(
'offline',
'云端文件已删除'
);

showToast(
'云端数据文件已删除，请点击“同步”确认是否重新创建',
'error'
);

return{
ok:false,
conflict:true
}
}

if(
hasBaseline &&
interactive &&
!confirm(
'云端数据文件已删除。是否用当前本地数据重新创建？'
)
){
return{
ok:false,
conflict:true
}
}

try{
const sha=
await writeRemoteState(
localAtStart
);

await finalizeSyncedState(
localAtStart,
sha,
localAtStart,
mutationAtStart,
{applySynced:false}
);

setCloudStatus(
syncMeta.dirty
?'offline'
:'online',
syncMeta.dirty
?'待同步'
:'已连接'
);

if(showMessage){
showToast(
'已创建云端数据文件',
'success'
)
}

return{
ok:true,
conflict:false
}
}catch(error){
if(
error?.status===409 &&
attempt<
MAX_WRITE_CONFLICT_RETRIES-1
){
continue
}

throw error
}
}

const remoteFingerprint=
getFingerprint(remote.state);

if(
localFingerprint===
remoteFingerprint
){
let finalSha=remote.sha;

if(remote.needsMigration){
try{
finalSha=await writeRemoteState(
remote.state,
remote.sha
)
}catch(error){
if(
error?.status===409 &&
attempt<
MAX_WRITE_CONFLICT_RETRIES-1
){
continue
}

throw error
}
}

await finalizeSyncedState(
remote.state,
finalSha,
localAtStart,
mutationAtStart,
{applySynced:false}
);

setCloudStatus(
syncMeta.dirty
?'offline'
:'online',
syncMeta.dirty
?'待同步'
:'已连接'
);

if(showMessage){
showToast(
remote.needsMigration
?'同步格式已升级，本地与云端已一致'
:'本地与云端已一致',
'success'
)
}

return{
ok:true,
conflict:false
}
}

if(
!hadStoredState &&
!hasBaseline
){
await finalizeSyncedState(
remote.state,
remote.sha,
localAtStart,
mutationAtStart,
{applySynced:true}
);

setCloudStatus(
syncMeta.dirty
?'offline'
:'online',
syncMeta.dirty
?'待同步'
:'已连接'
);

if(showMessage){
showToast(
`已从云端更新 ${pages.length} 个条目`,
'success'
)
}

return{
ok:true,
conflict:false
}
}

const base=
hasBaseline
?syncBase
:{
pages:[],
tombstones:[]
};

const baseFingerprint=
hasBaseline
?baselineFingerprint
:getFingerprint(base);

const localChanged=
localFingerprint!==baseFingerprint;

const remoteChanged=
remoteFingerprint!==baseFingerprint;

if(
hasBaseline &&
localChanged &&
!remoteChanged
){
try{
const sha=await writeRemoteState(
localAtStart,
remote.sha
);

await finalizeSyncedState(
localAtStart,
sha,
localAtStart,
mutationAtStart,
{applySynced:false}
);

setCloudStatus(
syncMeta.dirty
?'offline'
:'online',
syncMeta.dirty
?'待同步'
:'已连接'
);

if(showMessage){
showToast(
'本地数据已上传',
'success'
)
}

return{
ok:true,
conflict:false
}
}catch(error){
if(
error?.status===409 &&
attempt<
MAX_WRITE_CONFLICT_RETRIES-1
){
continue
}

throw error
}
}

if(
hasBaseline &&
!localChanged &&
remoteChanged
){
await finalizeSyncedState(
remote.state,
remote.sha,
localAtStart,
mutationAtStart,
{applySynced:true}
);

setCloudStatus(
syncMeta.dirty
?'offline'
:'online',
syncMeta.dirty
?'待同步'
:'已连接'
);

if(showMessage){
showToast(
`已从云端更新 ${pages.length} 个条目`,
'success'
)
}

return{
ok:true,
conflict:false
}
}

let mergedResult=
mergeSnapshots(
base,
localAtStart,
remote.state,
conflictPreference
);

if(
mergedResult.conflicts.length &&
!conflictPreference
){
if(!interactive){
setCloudStatus(
'offline',
'存在冲突'
);

showToast(
`检测到跨设备同字段冲突：${formatConflictSummary(mergedResult.conflicts)}。请点击“同步”处理。`,
'error'
);

return{
ok:false,
conflict:true
}
}

const preferLocal=confirm(
`检测到跨设备同字段冲突：${formatConflictSummary(mergedResult.conflicts)}。

确定：冲突字段优先采用本机值；未冲突字段仍自动合并。
取消：继续选择是否优先采用云端值。`
);

if(preferLocal){
conflictPreference='local'
}else{
const preferRemote=confirm(
'是否让冲突字段优先采用云端值？未冲突字段仍自动合并。'
);

if(!preferRemote){
setCloudStatus(
'offline',
'存在冲突'
);

showToast(
'已取消同步，数据未被覆盖',
'info'
);

return{
ok:false,
conflict:true
}
}

conflictPreference='remote'
}

mergedResult=mergeSnapshots(
base,
localAtStart,
remote.state,
conflictPreference
)
}

const merged=
mergedResult.snapshot;

const mergedFingerprint=
getFingerprint(merged);

if(
mergedFingerprint===
remoteFingerprint
){
await finalizeSyncedState(
merged,
remote.sha,
localAtStart,
mutationAtStart,
{applySynced:true}
);

setCloudStatus(
syncMeta.dirty
?'offline'
:'online',
syncMeta.dirty
?'待同步'
:'已连接'
);

if(showMessage){
showToast(
'已合并并采用云端最新版',
'success'
)
}

return{
ok:true,
conflict:false
}
}

try{
const sha=await writeRemoteState(
merged,
remote.sha
);

await finalizeSyncedState(
merged,
sha,
localAtStart,
mutationAtStart,
{applySynced:true}
);

setCloudStatus(
syncMeta.dirty
?'offline'
:'online',
syncMeta.dirty
?'待同步'
:'已连接'
);

if(showMessage){
showToast(
mergedResult.conflicts.length
?'冲突字段已按选择处理，其余修改已自动合并'
:'两台设备的修改已自动合并并同步',
'success'
)
}

return{
ok:true,
conflict:false
}
}catch(error){
if(
error?.status===409 &&
attempt<
MAX_WRITE_CONFLICT_RETRIES-1
){
continue
}

throw error
}
}

throw new Error(
'多次重试后仍无法完成同步'
)
}

function syncToCloud(
showMessage=true,
interactive=showMessage
){
if(!isConfigValid()){
if(showMessage){
showToast(
'请先点击 "配置" 按钮设置 GitHub 连接',
'error'
)
}

return Promise.resolve(false)
}

clearTimeout(autoSyncTimer);
autoSyncTimer=null;

syncRequested=true;

if(showMessage){
syncShowResult=true
}

if(interactive){
syncInteractive=true
}

if(syncInFlight){
return syncInFlight
}

syncInFlight=(async()=>{
let allOk=true;

while(syncRequested){
const announce=syncShowResult,
allowInteraction=syncInteractive;

syncRequested=false;
syncShowResult=false;
syncInteractive=false;
isSyncing=true;
syncBtn.disabled=true;

let result={
ok:false,
conflict:false
};

try{
result=await performSync({
showMessage:announce,
interactive:allowInteraction
})
}catch(error){
console.error(
'同步失败:',
error
);

setCloudStatus(
'offline',
error?.status===409
?'存在冲突'
:'同步失败'
);

if(
announce ||
!document.hidden
){
showToast(
`同步失败：${error?.message||error}`,
'error'
)
}

result={
ok:false,
conflict:
error?.status===409
}
}finally{
isSyncing=false;
syncBtn.disabled=false
}

allOk=
allOk &&
result.ok;

if(!result.ok){
syncRequested=false;
break
}
}

return allOk
})().finally(()=>{
syncInFlight=null
});

return syncInFlight
}

noteInput.value='';

remarkPicker.setValues([]);

pageInput.focus()
}

function getExportSiteName(){
const raw=
(
document.title ||
document.querySelector('h1')
?.childNodes?.[0]
?.textContent ||
'page'
)
.trim();

return raw.replace(
/[\\/:*?"<>|\s]+/g,
''
)||'page'
}

function createBackupSnapshot(){
const snapshot=
getLocalSnapshot();

return{
format:'pages-html-backup',
version:2,
exportedAt:Date.now(),
pages:
structuredClone(snapshot.pages),
tombstones:
structuredClone(snapshot.tombstones),
remarkHistory:[
...remarkHistory
],
remarkHidden:[
...remarkHidden
]
}
}

function readEmbeddedBackup(
doc=document
){
const node=
doc.getElementById(
'pagesBackupData'
);

if(!node)return null;

try{
const backup=
JSON.parse(
node.textContent||''
);

if(
!backup ||
backup.format!=='pages-html-backup' ||
![1,2].includes(backup.version) ||
!Array.isArray(backup.pages)
){
return null
}

return backup
}catch(error){
console.warn(
'HTML 备份数据解析失败:',
error
);

return null
}
}

function buildBackupHtml(){
const clone=
document.documentElement
.cloneNode(true);

clone
.querySelectorAll(
'.remark-tags'
)
.forEach(
node=>node.remove()
);

[
'remarkOptions',
'editRemarkOptions'
]
.forEach(id=>{
const node=
clone.querySelector(
'#'+id
);

if(node){
node.replaceChildren()
}
});

[
'remarkDropdown',
'editRemarkDropdown',
'editModal',
'configModal'
]
.forEach(id=>{
clone
.querySelector(
'#'+id
)
?.classList.add(
'hidden'
)
});

const tokenInput=
clone.querySelector(
'#cfgToken'
);

if(tokenInput){
tokenInput.value='';
tokenInput.removeAttribute(
'value'
)
}

const file=
clone.querySelector(
'#fileInput'
);

if(file){
file.value=''
}

clone
.querySelector(
'#pagesBackupData'
)
?.remove();

const backupScript=
document.createElement(
'script'
);

backupScript.id=
'pagesBackupData';

backupScript.type=
'application/json';

backupScript.textContent=
JSON.stringify(
createBackupSnapshot()
)
.replace(
/</g,
'\\u003c'
);

clone
.querySelector('body')
?.appendChild(
backupScript
);

return'<!DOCTYPE html>\n'+
clone.outerHTML
}

function exportData(){
if(pages.length===0){
alert(
'列表为空，没有什么可导出的。'
);

return
}

const html=
buildBackupHtml();

const blob=
new Blob(
[html],
{
type:
'text/html;charset=utf-8'
}
);

const url=
URL.createObjectURL(
blob
);

const a=
document.createElement(
'a'
);

const unixTime=
Math.floor(
Date.now()/1000
);

a.href=url;

a.download=
`${getExportSiteName()}${unixTime}.html`;

document.body.appendChild(a);

a.click();

document.body.removeChild(a);

URL.revokeObjectURL(url);

showToast(
'HTML 备份导出成功',
'success'
)
}

function parseImportPayload(
text,
fileName=''
){
const trimmed=
String(text||'')
.trim();

try{
const parsed=
JSON.parse(trimmed);

if(Array.isArray(parsed)){
return{
pages:
parsed.filter(
item=>
item &&
item.__pagesDeleted!==true &&
item.deleted!==true
),

remarkHistory:null,
remarkHidden:null,

tombstones:
parsed.filter(
item=>
item &&
(
item.__pagesDeleted===true ||
item.deleted===true
)
),

source:'JSON'
}
}

if(
parsed &&
Array.isArray(parsed.pages)
){
return{
pages:parsed.pages,
remarkHistory:
parsed.remarkHistory,
remarkHidden:
parsed.remarkHidden,
tombstones:
parsed.tombstones,
source:'JSON'
}
}
}catch(error){}

const looksLikeHtml=
/\.html?$/i.test(fileName) ||
/^<!doctype\s+html/i.test(trimmed) ||
/<html[\s>]/i.test(trimmed);

if(!looksLikeHtml){
throw new Error(
'不是有效的 JSON 或 HTML 备份文件'
)
}

const doc=
new DOMParser()
.parseFromString(
trimmed,
'text/html'
);

const backup=
readEmbeddedBackup(doc);

if(!backup){
throw new Error(
'HTML 文件中未找到有效的 Pages 备份数据'
)
}

return{
pages:backup.pages,
remarkHistory:
backup.remarkHistory,
remarkHidden:
backup.remarkHidden,
tombstones:
backup.tombstones,
source:'HTML'
}
}

function importData(file){
const reader=
new FileReader();

reader.onload=function(e){
try{
const imported=
parseImportPayload(
e.target.result,
file.name
);

const valid=
normalizePageArray(
imported.pages
);

if(valid.length===0){
alert(
'文件中没有找到有效的条目。'
);

return
}

if(
pages.length>0 &&
!confirm(
`当前有 ${pages.length} 个条目，导入将完全替换当前列表。确定继续吗？`
)
){
return
}

const importedIds=
new Set(
valid.map(item=>item.id)
);

pages.forEach(item=>{
if(
item?.id &&
!importedIds.has(item.id)
){
upsertTombstone(
item.id
)
}
});

pages=valid;

if(
Array.isArray(
imported.tombstones
)
){
tombstones=
normalizeTombstones([
...tombstones,
...imported.tombstones
])
}

if(
Array.isArray(
imported.remarkHistory
)
){
remarkHistory=
imported.remarkHistory
.map(normalizeRemarkValue)
.filter(Boolean)
}

if(
Array.isArray(
imported.remarkHidden
)
){
remarkHidden=
new Set(
imported.remarkHidden
.map(remarkHistoryKey)
.filter(Boolean)
)
}

applySortAndRender();

saveRemarkHidden();
saveRemarkHistory();

showToast(
`成功从 ${imported.source} 导入 ${pages.length} 个条目`,
'success'
);

markLocalChange()
}catch(err){
console.error(
'导入失败:',
err
);

alert(
`解析文件失败：${err.message||'文件格式无效'}`
)
}
};

reader.readAsText(file)
}

function syncConfigVisualViewport(){
const vv=
window.visualViewport;

const height=
vv
?vv.height
:window.innerHeight;

const top=
vv
?vv.offsetTop
:0;

document.documentElement
.style
.setProperty(
'--config-vv-height',
`${Math.max(1,Math.round(height))}px`
);

document.documentElement
.style
.setProperty(
'--config-vv-top',
`${Math.max(0,Math.round(top))}px`
)
}

function syncBackToTopPosition(){
if(
!tableWrapper ||
!backToTopBtn
){
return
}

const rect=
tableWrapper.getBoundingClientRect();

const buttonWidth=
backToTopBtn.offsetWidth||30;

const viewportWidth=
document.documentElement.clientWidth||
window.innerWidth;

const preferredLeft=
rect.right+30;

const maxLeft=
Math.max(
3,
viewportWidth-buttonWidth-3
);

backToTopBtn.style.left=
`${Math.max(
3,
Math.round(
Math.min(
preferredLeft,
maxLeft
)
)
)}px`;

backToTopBtn.style.right=
'auto'
}

function fastScrollToTop(duration=10){
const startY=
window.scrollY||
window.pageYOffset||
0;

if(startY<=0)return;

if(
backToTopAnimationFrame!==null
){
cancelAnimationFrame(
backToTopAnimationFrame
);

backToTopAnimationFrame=null
}

const startTime=
performance.now();

const easeOutCubic=
progress=>
1-Math.pow(
1-progress,
3
);

function step(now){
const progress=
Math.min(
1,
(now-startTime)/duration
);

const eased=
easeOutCubic(progress);

window.scrollTo(
0,
Math.round(
startY*(1-eased)
)
);

if(progress<1){
backToTopAnimationFrame=
requestAnimationFrame(step)
}else{
backToTopAnimationFrame=null;
window.scrollTo(0,0)
}
}

backToTopAnimationFrame=
requestAnimationFrame(step)
}
