<title>Pages</title>
<script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.23.0/dist/index.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f5f7fa;font-family:"Times New Roman","Microsoft YaHei","微软雅黑",sans-serif;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:2rem 1rem}
button,input,textarea,select{font-family:inherit}
.container{max-width:1100px;width:100%;background:white;border-radius:32px;box-shadow:0 20px 40px -12px rgba(0,0,0,.15);padding:2rem 1.8rem;transition:.2s}
h1{font-size:2.2rem;font-weight:600;color:#1e293b;letter-spacing:-.5px;border-bottom:2px solid #e9edf4;padding-bottom:.6rem;margin-bottom:1.8rem}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.remark-remove{flex:0 0 auto;border:0;background:transparent;color:inherit;cursor:pointer;font:inherit;font-size:1.15rem;width:24px;min-height:24px;border-radius:50%}.remark-remove:hover{background:#c7d2fe}.remark-remove:focus-visible{outline:2px solid #1e40af}

.remark-option-row{display:flex;align-items:stretch;gap:6px;width:100%;min-width:0}.remark-option-row+.remark-option-row{margin-top:2px}.remark-option-row .remark-option{flex:1 1 auto;width:auto;min-width:0}
.remark-option-actions{display:flex;flex:0 0 auto;align-items:center;gap:4px}.remark-manage-btn{min-width:32px;padding:.45rem .5rem;border:1px solid #d1d9e6;border-radius:8px;background:#fff;color:#475569;font:inherit;font-size:.78rem;line-height:1;cursor:pointer}

.page-table .col-title>a,.page-table .title-note,.page-table .title-remark{-webkit-user-select:text;user-select:text}.page-table .title-note,.page-table .title-remark{cursor:text}

.page-table .title-note,.page-table .title-remark{margin-top:.28rem;color:#000;font-size:1rem;font-weight:400;line-height:1.45;white-space:normal;overflow-wrap:anywhere}
.page-table .title-note{width:calc(100% + var(--edit-reserve));max-width:calc(100% + var(--edit-reserve));text-align:justify;text-justify:inter-character;text-align-last:left}.page-table .title-remark .remark-line{display:block}
.page-table .row-edit-link{position:absolute;right:1.2rem;bottom:.8rem;border:none;background:transparent;color:#64748b;padding:0;font:inherit;font-size:1rem;font-weight:400;line-height:1.45;cursor:default;text-decoration:none}.page-table .row-edit-link:hover,.page-table .row-edit-link:focus-visible{color:#64748b;text-decoration:none;outline:none}
.empty-row td{padding:2.5rem 1rem;text-align:center;color:#94a3b8;font-size:1rem;background:#fafcff}
.list-header{display:flex;justify-content:space-between;align-items:baseline;margin:1.8rem 0 .8rem;flex-wrap:wrap;gap:10px}.list-header h2{font-size:1.4rem;font-weight:600;color:#0f172a}.list-header .badge{background:#e9edf4;padding:.2rem 1rem;border-radius:40px;font-size:.8rem;font-weight:500;color:#334155}

.config-box .form-group input{width:100%;background:white;border:1px solid #d1d9e6;border-radius:14px;padding:.7rem 1rem;font-size:.95rem;font-family:inherit;transition:.2s}.config-box .form-group input:focus{outline:2px solid #1E40AF;border-color:transparent}.config-box .form-group .hint{font-size:.75rem;color:#94a3b8;margin-top:4px}.config-box .form-group .hint a{color:#1E40AF;text-decoration:none;cursor:default}.config-box .form-group .hint a:hover{text-decoration:underline}
.config-box .token-save-option{display:flex;flex-direction:row;align-items:center;gap:8px;margin-top:8px;color:#475569;font-size:.82rem;font-weight:500;text-transform:none;letter-spacing:0;cursor:pointer}.config-box .token-save-option input[type=checkbox]{width:16px;height:16px;margin:0;padding:0;accent-color:#1E40AF;cursor:pointer;flex:0 0 auto}.config-box .token-save-hint{margin-left:24px;color:#64748b;line-height:1.5}
.config-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:1.2rem;position:sticky;bottom:0;z-index:3;background:linear-gradient(to bottom,rgba(255,255,255,.88),#fff 24%);padding:.9rem 0 max(.2rem,env(safe-area-inset-bottom))}.config-actions .btn-config{padding:.5rem 1.8rem;border-radius:40px;font-weight:600;font-size:.9rem;border:none;cursor:pointer;transition:.15s}.config-actions .btn-config.primary{background:#1E40AF;color:white}.config-actions .btn-config.primary:hover{background:#1E3A8A}.config-actions .btn-config.secondary{background:#f1f5f9;color:#334155}.config-actions .btn-config.secondary:hover{background:#e2e8f0}
.back-to-top{position:fixed;right:16px;top:70%;transform:translateY(-50%);z-index:900;display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;padding:0;border:1px solid #1E40AF;border-radius:999px;background:#1E40AF;color:#fff;font-family:inherit;font-size:.78rem;line-height:1;cursor:pointer;opacity:1;box-shadow:0 4px 14px rgba(30,64,175,.24);transition:opacity .2s,background .2s,color .2s,transform .2s}.back-to-top:hover,.back-to-top:focus-visible{opacity:1;background:#1E3A8A;border-color:#1E3A8A;color:#fff;transform:translateY(calc(-50% - 2px));outline:none}
@media(max-width:700px){
body{width:100%;max-width:100%;padding:.75rem .5rem;overflow-x:hidden}.container{width:100%;max-width:100%;min-width:0;padding:1.2rem}.table-wrapper{width:100%;max-width:100%;min-width:0;overflow-x:hidden}.page-table{width:100%;max-width:100%;min-width:0;table-layout:fixed}.page-table th,.page-table td,.page-table .col-title{width:100%;max-width:100%;min-width:0}.page-table .col-title{overflow-wrap:anywhere;word-break:break-word}.page-table .col-title>a{display:inline;max-width:100%;overflow-wrap:anywhere;word-break:break-all}.page-table .title-note,.page-table .title-remark{max-width:100%;overflow-wrap:anywhere;word-break:break-word}.page-table .col-title{--edit-reserve:0rem;padding-right:.8rem}.page-table .title-note{width:100%;max-width:100%}.page-table .row-edit-link{right:.8rem;bottom:.6rem}.form-grid{grid-template-columns:1fr}.page-table th,.page-table td{padding:.6rem .8rem;font-size:.85rem}.toolbar{flex-direction:column;align-items:stretch}.toolbar .left-group,.toolbar .right-group{justify-content:center}.cloud-status{float:none;margin-top:0}.config-overlay{align-items:stretch;padding:max(8px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom))}.config-box{width:100%;max-height:calc(100dvh - max(16px,env(safe-area-inset-top) + env(safe-area-inset-bottom) + 8px));margin:auto 0;padding:1.25rem 1rem .8rem;border-radius:22px}.config-actions{gap:8px}.config-actions .btn-config{flex:1 1 0;min-width:0;padding-left:.75rem;padding-right:.75rem}.back-to-top{right:3px;top:70%;width:24px;height:24px;padding:0;font-size:.68rem}
}
.config-box{padding:0;display:grid;grid-template-rows:minmax(0,1fr) auto;overflow:hidden}

.config-scroll::-webkit-scrollbar{width:10px}.config-scroll::-webkit-scrollbar-track{background:#eef2f7}.config-scroll::-webkit-scrollbar-thumb{background:#94a3b8;border:2px solid #eef2f7;border-radius:999px}

<body>
<div class="container">
<h1>Pages <span class="cloud-status" id="cloudStatus"><span class="dot" id="statusDot"></span><span id="statusText">未配置</span></span></h1>
<div class="toolbar">
<div class="left-group">
<button class="btn-sync" id="syncBtn">同步</button>
<button class="btn-outline" id="configBtn">配置</button>
<button class="btn-outline" id="exportBtn">导出</button>
<button class="btn-outline" id="importBtn">导入</button>
<input type="file" id="fileInput" accept=".json" style="display:none">
</div>
<div class="right-group"><span style="font-size:0.8rem;color:#94a3b8" id="lastSyncTime">未同步</span></div>
</div>

<div class="add-section">
<h2>添加</h2>
<div class="form-grid">
<div class="form-group full-width"><label for="pageInput">标题</label><input type="text" id="pageInput" autofocus></div>
<div class="form-group full-width"><label for="noteInput">提要</label><input type="text" id="noteInput"></div>
<div class="form-group full-width"><label for="remarkInput">备注</label><div class="remark-combo" id="remarkCombo"><input type="text" id="remarkInput" autocomplete="off" aria-autocomplete="list" aria-expanded="false" aria-controls="remarkOptions"><div class="remark-dropdown hidden" id="remarkDropdown"><div id="remarkOptions"></div></div></div></div>
<button class="btn-primary" id="addBtn">添加</button>
</div>
</div>

<div class="list-header"><h2>总表</h2><span class="badge" id="countDisplay">0/0</span></div>
<div class="table-wrapper"><table class="page-table" id="pageTable"><thead><tr><th>标题</th></tr></thead><tbody id="tableBody"><tr class="empty-row"><td>加载中...</td></tr></tbody></table></div>
</div>

<div class="modal-overlay hidden" id="editModal">
<div class="modal-box">
<h3>编辑条目</h3>
<div class="modal-sub" id="editModalTitle">标题：<span id="editTitleDisplay"></span></div>
<div class="form-group"><label for="editPageInput">标题</label><input type="text" id="editPageInput"><div class="hint">格式：[标题](链接)</div></div>
<div class="form-group"><label for="editNoteInput">提要</label><input type="text" id="editNoteInput"></div>
<div class="form-group"><label for="editRemarkInput">备注</label><div class="remark-combo" id="editRemarkCombo"><input type="text" id="editRemarkInput" autocomplete="off" aria-autocomplete="list" aria-expanded="false" aria-controls="editRemarkOptions"><div class="remark-dropdown hidden" id="editRemarkDropdown"><div id="editRemarkOptions"></div></div></div></div>
<div class="modal-actions"><button class="btn-modal delete" id="editDeleteBtn">删除</button><div class="modal-actions-right"><button class="btn-modal cancel" id="editCancelBtn">取消</button><button class="btn-modal save" id="editSaveBtn">保存</button></div></div>
</div>
</div>

<div class="config-overlay hidden" id="configModal">
<div class="config-box">
<div class="config-scroll">
<h3>GitHub 云端配置</h3>
<div class="config-desc">配置后数据将保存到您的 GitHub 仓库，在任何设备上打开都能同步。</div>
<div class="form-group"><label for="cfgToken">GitHub Personal Access Token *</label><input type="password" id="cfgToken" name="github-token" autocomplete="current-password" spellcheck="false" placeholder="ghp_xxxxxxxxxxxx"><label class="token-save-option" for="cfgRememberToken"><input type="checkbox" id="cfgRememberToken" checked><span>在本设备保存Token。若浏览器出现“保存密码”提示，请选择保存；开启浏览器密码同步后，其他设备可自动填充。</span></label><div class="hint"><a href="https://github.com/settings/tokens" target="_blank" rel="noopener noreferrer">创建 Token</a>（需要勾选 <strong>repo</strong> 权限，有效期建议选择 <strong>No expiration</strong>）</div></div>
<div class="form-group"><label for="cfgOwner">仓库所有者 *</label><input type="text" id="cfgOwner" placeholder="你的GitHub用户名"></div>
<div class="form-group"><label for="cfgRepo">仓库名称 *</label><input type="text" id="cfgRepo" placeholder="仓库名"><div class="hint">数据将保存在此仓库的 pages_data.json 文件中</div></div>
<div class="form-group"><label for="cfgFile">数据文件名</label><input type="text" id="cfgFile" placeholder="pages_data.json" value="pages_data.json"></div>
</div>
<div class="config-actions"><button type="button" class="btn-config secondary" id="configCancelBtn">取消</button><button type="button" class="btn-config primary" id="configSaveBtn">保存并连接</button></div>
</div>
</div>

<button class="back-to-top" id="backToTopBtn" type="button" aria-label="回到顶部" title="回到顶部"></button>
<div class="toast hidden" id="toast"></div>

<script>

function applySortAndRender(){sortPages();rebuildRemarkHistory();renderTable();saveToLocal()}
function renderTable(){const remarkedCount=pages.reduce((count,item)=>count+(normalizeRemarks(item&&item.remark).length?1:0),0);countDisplay.textContent=`${remarkedCount}/${pages.length}`;if(pages.length===0){tableBody.innerHTML='<tr class="empty-row"><td>列表为空，添加一个吧！</td></tr>';return}
let html='';pages.forEach((item,index)=>{const title=escapeHtml(item.title||''),url=escapeHtml(item.url||''),note=escapeHtml(item.note||''),remarkValues=normalizeRemarks(item.remark),displayHtml=url?`<a href="${url}" target="_blank" rel="noopener noreferrer" draggable="false">${title}</a>`:title,noteHtml=note?`<div class="title-note">${note}</div>`:'',remarkHtml=remarkValues.length?`<div class="title-remark">${remarkValues.map(value=>`<div class="remark-line">${escapeHtml(value)}</div>`).join('')}</div>`:'<div class="title-remark"></div>';html+=`<tr data-index="${index}"><td class="col-title">${displayHtml}${noteHtml}${remarkHtml}<button class="row-edit-link edit-btn" data-index="${index}" type="button">编辑</button></td></tr>`});tableBody.innerHTML=html;
document.querySelectorAll('#tableBody .col-title > a').forEach(link=>{link.addEventListener('dragstart',e=>e.preventDefault());link.addEventListener('click',function(e){const selection=window.getSelection(),hasSelected=selection&&!selection.isCollapsed&&(this.contains(selection.anchorNode)||this.contains(selection.focusNode));if(hasSelected)e.preventDefault()})});
document.querySelectorAll('#tableBody .edit-btn').forEach(btn=>btn.addEventListener('click',function(e){e.stopPropagation();const index=this.getAttribute('data-index');if(index!==null){const idx=parseInt(index,10);if(!isNaN(idx)&&idx>=0&&idx<pages.length)openEditModal(idx)}}))}

function openEditModal(index){editingIndex=index;const item=pages[index];editTitleDisplay.textContent=item.title;if(item.url){const mode=item.titleMode||(item.title===item.url?'url':'markdown');editPageInput.value=mode==='url'?item.url:`[${item.title}](${item.url})`}else editPageInput.value=item.title;editNoteInput.value=item.note||'';editRemarkPicker.setValues(item.remark);editModal.classList.remove('hidden');setTimeout(()=>editPageInput.focus(),100)}
function closeEditModal(){editModal.classList.add('hidden');editingIndex=null}
function saveEdit(){if(editingIndex===null||editingIndex<0||editingIndex>=pages.length){alert('编辑出错，请重试。');closeEditModal();return}const raw=editPageInput.value.trim();if(!raw){alert('请填写 Page 字段。');editPageInput.focus();return}const parsed=parsePageInput(raw);if(!parsed.title){alert('请正确填写格式：[标题](链接)');editPageInput.focus();return}pages[editingIndex].title=parsed.title;pages[editingIndex].url=parsed.url;pages[editingIndex].titleMode=parsed.titleMode;pages[editingIndex].note=editNoteInput.value.trim();pages[editingIndex].remark=editRemarkPicker.getValues();rememberRemark(pages[editingIndex].remark);closeEditModal();applySortAndRender();if(isConfigValid())syncToCloud(false)}
function deleteEditingEntry(){if(editingIndex===null||editingIndex<0||editingIndex>=pages.length){alert('删除出错，请重试。');closeEditModal();return}const item=pages[editingIndex];if(!confirm(`确定要删除 "${item.title}" 吗？`))return;pages.splice(editingIndex,1);closeEditModal();applySortAndRender();if(isConfigValid())syncToCloud(false)}
function addPage(){const raw=pageInput.value.trim(),note=noteInput.value.trim(),remark=remarkPicker.getValues();if(!raw){alert('请填写“标题”字段。');pageInput.focus();return}const parsed=parsePageInput(raw);if(!parsed.title){alert('请正确填写格式：[标题](链接)');pageInput.focus();return}pages.push({title:parsed.title,url:parsed.url,titleMode:parsed.titleMode,note,remark});rememberRemark(remark);applySortAndRender();if(isConfigValid())syncToCloud(false);pageInput.value='';noteInput.value='';remarkPicker.setValues([]);pageInput.focus()}

function exportData(){if(pages.length===0){alert('列表为空，没有什么可导出的。');return}const jsonStr=JSON.stringify(pages,null,2),blob=new Blob([jsonStr],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`pages_backup_${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);showToast('导出成功','success')}
function importData(file){const reader=new FileReader();reader.onload=function(e){try{const imported=JSON.parse(e.target.result);if(!Array.isArray(imported)){alert('文件格式错误：不是一个有效的列表。');return}const valid=imported.filter(item=>item.title&&item.title.trim()!=='');if(valid.length===0){alert('文件中没有找到有效的条目。');return}if(pages.length>0&&!confirm(`当前有 ${pages.length} 个条目，导入将完全替换当前列表。确定继续吗？`))return;pages=valid;applySortAndRender();showToast(`成功导入 ${pages.length} 个条目`,'success');if(isConfigValid())syncToCloud(false)}catch(err){alert('解析文件失败，请确保是有效的 JSON 文件。')}};reader.readAsText(file)}
function setCloudStatus(status,text){statusDot.className='dot '+status;statusText.textContent=text}
function showToast(message,type='info'){toast.textContent=message;toast.className='toast '+type;toast.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.add('hidden'),3000)}

function syncConfigVisualViewport(){const vv=window.visualViewport,height=vv?vv.height:window.innerHeight,top=vv?vv.offsetTop:0;document.documentElement.style.setProperty('--config-vv-height',`${Math.max(1,Math.round(height))}px`);document.documentElement.style.setProperty('--config-vv-top',`${Math.max(0,Math.round(top))}px`)}
function isMobileConfigLayout(){return window.matchMedia('(max-width: 700px)').matches}
function openConfigModal(){cfgToken.value=config.token||'';cfgRememberToken.checked=config.rememberToken!==false;cfgOwner.value=config.owner||'';cfgRepo.value=config.repo||'';cfgFile.value=config.file||'pages_data.json';syncConfigVisualViewport();configModal.classList.remove('hidden');const scroll=configModal.querySelector('.config-scroll');if(scroll)scroll.scrollTop=0;if(!isMobileConfigLayout())requestAnimationFrame(()=>cfgToken.focus({preventScroll:true}))}
function closeConfigModal(){configModal.classList.add('hidden')}
function saveConfigAndConnect(){const token=cfgToken.value.trim(),owner=cfgOwner.value.trim(),repo=cfgRepo.value.trim(),file=cfgFile.value.trim()||'pages_data.json';if(!token){showToast('请输入 GitHub Token','error');cfgToken.focus();return}if(!owner){showToast('请输入仓库所有者','error');cfgOwner.focus();return}if(!repo){showToast('请输入仓库名称','error');cfgRepo.focus();return}config.token=token;config.owner=owner;config.repo=repo;config.file=file;saveConfig();closeConfigModal();showToast('配置已保存，正在连接...','info');loadFromCloud()}

addBtn.addEventListener('click',addPage);
document.querySelectorAll('.add-section .form-group input, .add-section .form-group textarea').forEach(input=>{if(input===remarkInput)return;input.addEventListener('keydown',function(e){if(e.key==='Enter'){if(this.tagName==='TEXTAREA'){if(e.ctrlKey||e.shiftKey){e.preventDefault();addPage()}}else{e.preventDefault();addPage()}}})});
exportBtn.addEventListener('click',exportData);importBtn.addEventListener('click',()=>fileInput.click());fileInput.addEventListener('change',function(){if(this.files&&this.files.length>0){importData(this.files[0]);this.value=''}});
syncBtn.addEventListener('click',()=>{if(pages.length===0){showToast('没有数据需要同步','info');return}syncToCloud(true)});
if(window.visualViewport){window.visualViewport.addEventListener('resize',syncConfigVisualViewport);window.visualViewport.addEventListener('scroll',syncConfigVisualViewport)}
window.addEventListener('resize',syncConfigVisualViewport);window.addEventListener('orientationchange',syncConfigVisualViewport);syncConfigVisualViewport();configBtn.addEventListener('click',openConfigModal);

function fastScrollToTop(duration=10){const startY=window.scrollY||window.pageYOffset||0;if(startY<=0)return;if(backToTopAnimationFrame!==null){cancelAnimationFrame(backToTopAnimationFrame);backToTopAnimationFrame=null}const startTime=performance.now(),easeOutCubic=progress=>1-Math.pow(1-progress,3);function step(now){const progress=Math.min(1,(now-startTime)/duration),eased=easeOutCubic(progress);window.scrollTo(0,Math.round(startY*(1-eased)));if(progress<1)backToTopAnimationFrame=requestAnimationFrame(step);else{backToTopAnimationFrame=null;window.scrollTo(0,0)}}backToTopAnimationFrame=requestAnimationFrame(step)}
backToTopBtn.addEventListener('click',()=>fastScrollToTop(10));
configCancelBtn.addEventListener('click',closeConfigModal);configSaveBtn.addEventListener('click',saveConfigAndConnect);configModal.addEventListener('click',function(e){if(e.target===this)closeConfigModal()});editDeleteBtn.addEventListener('click',deleteEditingEntry);editCancelBtn.addEventListener('click',closeEditModal);editSaveBtn.addEventListener('click',saveEdit);

let editOverlayPointerDown=false;editModal.addEventListener('pointerdown',function(e){editOverlayPointerDown=e.target===this});editModal.addEventListener('pointerup',function(e){const shouldClose=editOverlayPointerDown&&e.target===this;editOverlayPointerDown=false;if(shouldClose)closeEditModal()});editModal.addEventListener('pointercancel',()=>{editOverlayPointerDown=false});
document.querySelectorAll('#editModal .form-group input, #editModal .form-group textarea').forEach(input=>{if(input===editRemarkInput)return;input.addEventListener('keydown',function(e){if(e.key==='Enter'){if(this.tagName==='TEXTAREA'){if(e.ctrlKey||e.shiftKey){e.preventDefault();saveEdit()}}else{e.preventDefault();saveEdit()}}})});

loadRemarkHidden();
const remarkPicker=setupRemarkCombo({input:remarkInput,dropdown:remarkDropdown,options:remarkOptions,combo:remarkCombo,submit:addPage,manageOptions:true});
const editRemarkPicker=setupRemarkCombo({input:editRemarkInput,dropdown:editRemarkDropdown,options:editRemarkOptions,combo:editRemarkCombo,submit:saveEdit});
loadConfig();loadFromCloud();
})();
</script>
</body>
</html>
